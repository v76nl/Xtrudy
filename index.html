<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtrudy | wash</title>

    <link rel="icon" href="favicon.ico" sizes="any">
    <!-- <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png"> -->



    <!-- フォント読み込みに使う opentype.js (グローバル変数 opentype を提供) -->
    <script src="https://unpkg.com/opentype.js@1.3.4/dist/opentype.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- フォント読み込み中に表示するオーバーレイ -->
    <div id="loading">処理中……</div>

    <!-- 左サイドのコントロールパネル (非表示時は collapsed クラスが付く) -->
    <div id="ui-panel">
        <div class="panel-header">
            <h1 class="panel-title">Xtrudy</h1>
            <a href="https://github.com/v76nl/Xtrudy" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub リポジトリ" aria-label="GitHub リポジトリ">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                </svg>
            </a>
        </div>

        <!-- 概算サイズ表示 (モデル全体の AABB から計算) -->
        <div class="control-group">
            <label class="control-label">概算サイズ</label>
            <div id="dimensions-info" class="dimensions-card">
                <div class="dim-row">
                    <span class="dim-label">幅</span>
                    <span class="dim-value" id="dim-w">0.0</span>
                    <span class="dim-unit">mm</span>
                </div>
                <div class="dim-row">
                    <span class="dim-label">高さ</span>
                    <span class="dim-value" id="dim-h">0.0</span>
                    <span class="dim-unit">mm</span>
                </div>
                <div class="dim-row">
                    <span class="dim-label">奥行き</span>
                    <span class="dim-value" id="dim-d">0.0</span>
                    <span class="dim-unit">mm</span>
                </div>
            </div>
        </div>

        <!-- 入力ソース選択とその設定 (テキスト / SVG を切り替え) -->
        <div class="control-group">
            <label class="control-label mb-2">入力ソース</label>
            <div class="mode-switch-group">
                <button id="mode-text" class="btn-mode active">テキスト</button>
                <button id="mode-svg" class="btn-mode">SVG</button>
            </div>

            <!-- テキストモード用コントロール -->
            <div id="controls-text">
                <label class="control-label">テキスト</label>
                <input type="text" id="input-text" class="mb-2">

                <label class="control-label">フォント</label>
                <select id="font-select" class="mb-2">
                    <option value="sans">Noto Sans JP (ゴシック)</option>
                    <option value="serif">Noto Serif JP (明朝)</option>
                    <option value="dot">DotGothic16</option>
                    <option value="ramp">Rampart One</option>
                </select>

                <div class="slider-container">
                    <label class="slider-label">文字サイズ</label>
                    <input type="range" id="text-size" min="5" max="100">
                </div>
                <div class="slider-container">
                    <label class="slider-label">字間</label>
                    <input type="range" id="text-spacing" min="-5" max="20" step="0.5">
                </div>
            </div>

            <!-- SVGモード用コントロール -->
            <div id="controls-svg" style="display: none;">
                <label class="control-label">SVGファイル</label>
                <input type="file" id="input-file" accept=".svg" class="mb-2">
                <div class="slider-container">
                    <label class="slider-label">スケール</label>
                    <input type="range" id="svg-scale" min="0.01" max="5.0" step="0.01">
                </div>
            </div>

            <!-- 共通: 押し出し厚みと左右反転 (左右反転はハンコ用) -->
            <div class="slider-container mt-2">
                <label class="slider-label">厚み</label>
                <input type="range" id="model-thickness" min="1" max="20" step="0.5">
                <span id="val-thickness" class="slider-val-inline"></span>
            </div>
            <div class="checkbox-row mt-2">
                <label class="checkbox-label" for="mirror-x">左右反転</label>
                <input type="checkbox" id="mirror-x">
            </div>
        </div>

        <!-- 土台プレート設定 (メインモデルの背面に貼り付く平板) -->
        <div class="control-group">
            <div class="checkbox-row mb-2">
                <label class="control-label m-0">土台</label>
                <input type="checkbox" id="base-enable">
            </div>
            <!-- opacity / pointer-events は JS の initUIFromState() で制御 -->
            <div id="controls-base" style="transition: opacity 0.2s;">
                <div class="slider-container">
                    <label class="slider-label">余白</label>
                    <input type="range" id="base-padding" min="0" max="20" step="0.5">
                </div>
                <div class="slider-container">
                    <label class="slider-label">厚み</label>
                    <input type="range" id="base-thickness" min="0.5" max="10" step="0.5">
                </div>
                <div class="slider-container">
                    <label class="slider-label">角丸</label>
                    <input type="range" id="base-radius" min="0" max="20" step="0.5">
                </div>
            </div>
        </div>

        <!-- ストラップリング設定 (キーホルダー用の穴あきリング) -->
        <div class="control-group">
            <div class="checkbox-row mb-2">
                <label class="control-label m-0">ストラップリング</label>
                <input type="checkbox" id="ring-enable">
            </div>
            <div id="controls-ring">
                <label class="control-label mt-1">形状</label>
                <!-- 値は segment 数。32=真円(中空円柱)、その他=トーラス -->
                <select id="ring-shape" class="mb-2">
                    <option value="32">真円</option>
                    <option value="4">正方形</option>
                    <option value="3">正三角形</option>
                    <option value="5">正五角形</option>
                </select>

                <!-- 補強板: 真円選択時のみ表示。表示制御は updateReinforceVisibility() が行う -->
                <div id="ctrl-ring-reinforce" class="checkbox-row">
                    <label class="checkbox-label accent" for="ring-reinforce">補強板</label>
                    <input type="checkbox" id="ring-reinforce">
                </div>

                <div class="checkbox-row">
                    <label class="checkbox-label accent" for="ring-auto-y">上端に自動配置</label>
                    <input type="checkbox" id="ring-auto-y">
                </div>

                <!-- スライダーと数値入力の双方向バインド -->
                <div class="slider-container">
                    <label class="slider-label">X座標</label>
                    <input type="range" id="ring-x" min="-100" max="100" step="0.5">
                    <input type="number" id="val-ring-x" class="slider-val" step="0.5">
                </div>
                <div class="slider-container">
                    <label class="slider-label">Y座標</label>
                    <input type="range" id="ring-y" min="-100" max="100" step="0.5">
                    <input type="number" id="val-ring-y" class="slider-val" step="0.5">
                </div>
                <div class="slider-container">
                    <label class="slider-label">サイズ</label>
                    <input type="range" id="ring-size" min="1" max="20" step="0.5">
                    <input type="number" id="val-ring-size" class="slider-val" step="0.5">
                </div>
                <div class="slider-container">
                    <label class="slider-label">太さ</label>
                    <input type="range" id="ring-tube" min="0.5" max="5" step="0.1">
                    <input type="number" id="val-ring-tube" class="slider-val" step="0.1">
                </div>
                <div class="slider-container">
                    <label class="slider-label">回転</label>
                    <input type="range" id="ring-rot" min="0" max="360" step="15">
                    <input type="number" id="val-ring-rot" class="slider-val" step="15">
                </div>
            </div>
        </div>

        <!-- STL バイナリ形式でエクスポート -->
        <div class="control-group">
            <button id="btn-export" class="btn">STLを出力</button>
        </div>
    </div>

    <!-- サイドパネルの表示/非表示トグルボタン -->
    <button id="toggle-ui" aria-label="UIを隠す" title="UIを隠す"></button>

    <!-- ナビゲーションギズモ (右上固定。canvas は Three.js が別レンダラーで描画) -->
    <div id="gizmo-container">
        <canvas id="gizmo-canvas" width="120" height="120"></canvas>
    </div>

    <!-- メインの WebGL キャンバス -->
    <canvas id="gl-canvas"></canvas>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
